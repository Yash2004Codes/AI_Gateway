# Production / public demo stack for a single host.
# Differences from docker-compose.yml:
#   - Postgres, Redis and the API publish NO host ports (reachable only on the internal network)
#   - Caddy is the only public entry point: ports 80/443, automatic HTTPS
#   - Every secret comes from .env.prod (see deploy/deploy.sh)
#
# Run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/server/src/db/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-server:
    build:
      context: ./packages/server
      target: production
    environment: &app_env
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: https://${DOMAIN:?}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-true}
      FAIR_SHARE_BUFFER: ${FAIR_SHARE_BUFFER:-5}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${CIRCUIT_BREAKER_COOLDOWN_MS:-10000}
      DEMO_MODE: ${DEMO_MODE:-true}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./packages/server
      target: production
    command: ["node", "dist/worker.js"]
    environment: *app_env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  dashboard:
    build:
      context: ./packages/dashboard
    depends_on:
      - api-server
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  caddy_data:
  caddy_config:
